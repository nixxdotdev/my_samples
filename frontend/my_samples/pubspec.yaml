name: sample_flow
description: "SampleFlow - TikTok Shop Creator & Affiliate Sample Management App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  lucide_icons_flutter: ^3.1.24
  url_launcher: ^6.3.3
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: 18.0.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/sf_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/sf_logo_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logo/sf_logo_v1.png"
  color_dark: "#0F1E24"
  image_dark: "assets/logo/sf_logo_v1.png"
  android_12:
    image: "assets/logo/sf_logo_v1.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/logo/sf_logo_v1.png"
    icon_background_color_dark: "#0F1E24"
  android: true
  ios: true
