/api/users:
  get:
    tags:
      - Users
    summary: Retrieve all users
    responses:
      200:
        description: List of users

  post:
    tags:
      - Users
    summary: Create a user
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
    responses:
      201:
        description: User created
